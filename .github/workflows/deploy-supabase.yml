name: Supabase へデプロイ

# データベースのスキーマと Edge Functions を Supabase に反映する。
#
# 実行方法:
#   1. GitHub の Actions タブ → 「Supabase へデプロイ」→ Run workflow
#   2. または supabase/ 配下を変更して main に push
#
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  … https://supabase.com/dashboard/account/tokens で発行
#   SUPABASE_PROJECT_REF   … プロジェクトURL https://supabase.com/dashboard/project/<これ>
#   SUPABASE_DB_PASSWORD   … プロジェクト作成時に決めたデータベースのパスワード

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

jobs:
  deploy:
    name: スキーマと Edge Functions を反映
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Secrets が設定されているか確認
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ]           && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$DB_PASSWORD" ]           && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::次の Secrets が未設定です:$missing"
            echo "リポジトリの Settings → Secrets and variables → Actions から追加してください。"
            exit 1
          fi
          echo "Secrets は揃っています"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: プロジェクトに接続
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: データベースのスキーマを反映
        run: supabase db push --password "$DB_PASSWORD"

      - name: Edge Functions を配置
        run: |
          for fn in get-session place-order get-bill call-staff; do
            echo "--- $fn ---"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: 次の作業を表示
        run: |
          {
            echo "## Supabase への反映が完了しました"
            echo ""
            echo "続けて以下を行うと BACK-system にログインできます。"
            echo ""
            echo '1. Supabase ダッシュボード → Authentication → Users → Add user で店員のユーザーを作成'
            echo '2. SQL Editor で次を実行(メールアドレスを差し替える)'
            echo ''
            echo '```sql'
            echo "insert into public.staff_users (id, display_name, role)"
            echo "select id, '店長', 'admin' from auth.users"
            echo " where email = 'ここに店員のメールアドレス'"
            echo "on conflict (id) do update set role = 'admin';"
            echo '```'
            echo ''
            echo '3. Authentication → Providers → Email の「Allow new users to sign up」を **オフ** にする'
            echo '   (店員専用のため、外部から勝手にアカウントを作られないようにする)'
          } >> "$GITHUB_STEP_SUMMARY"
